name: rpd_app
description: RPD Sangathan field app — GetX, Hive, multilingual.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.9.0
  geolocator: ^14.0.2
  google_fonts: ^6.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env
