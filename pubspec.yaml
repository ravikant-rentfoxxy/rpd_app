name: rpd_app
description: RPD Sangathan field app — GetX, Hive, multilingual.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.9.0
  http_parser: ^4.1.2
  geolocator: ^14.0.2
  google_fonts: ^6.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  another_flushbar: ^1.12.32
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.3.1
  shimmer: ^3.0.0
  firebase_crashlytics: ^5.4.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  upgrader: ^13.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#291668"
  adaptive_icon_foreground: assets/images/app_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_bg.jpg
    - assets/images/login_logo.jpg
    - assets/images/app_logo.png
